<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Finder</title>
    <link rel="stylesheet" href="10_task.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>🎓 University Finder</h1>
            <p>Discover universities around the world</p>
        </header>

        <div class="search-box">
            <input 
                type="text" 
                id="countryInput" 
                placeholder="Enter country name (e.g. India)"
            >

            <button id="searchBtn">Search</button>
        </div>

        <p id="message">Enter a country name to find universities.</p>

        <div id="universityList" class="university-list"></div>

    </div>

    <script src="10_task.js"></script>
</body>
</html>
